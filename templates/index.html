<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ translations.title }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div>
                <h1>{{ translations.title }}</h1>
                <p>{{ translations.subtitle }}</p>
            </div>
            <div class="language-switcher">
                <label for="language">{{ translations.language_label }}</label>
                <select id="language" name="language">
                    {% for lang_code in languages %}
                    <option value="{{ lang_code }}" {% if lang_code == lang %}selected{% endif %}>
                        {{ lang_code | upper }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </header>

        <main class="console-panel">
            <div class="console-content">
                <div class="input-grid">
                    {% for field in feature_names %}
                    <div class="field-block">
                        <label for="{{ field }}">{{ field_labels[field] }}</label>
                        <input
                            id="{{ field }}"
                            name="{{ field }}"
                            type="text"
                            placeholder="{{ placeholders[field] }}"
                            autocomplete="off"
                        />
                        <span class="field-error" data-field-error-for="{{ field }}"></span>
                    </div>
                    {% endfor %}
                </div>

                <div class="action-row">
                    <button id="predictButton">{{ translations.predict_button }}</button>
                    <button class="secondary" id="resetButton">{{ translations.reset_button }}</button>
                </div>

                <div class="result-panel" id="resultPanel" hidden>
                    <p class="result-label" id="resultLabel"></p>
                    <p class="result-confidence" id="resultConfidence"></p>
                    <p class="result-explanation" id="resultExplanation"></p>
                </div>

                <div class="progress-bar" id="progressBar" hidden>
                    <div class="progress-bar__fill" id="progressFill"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const TRANSLATIONS = {{ translations | tojson | safe }};
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
